<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>LINE連携 | シフト希望応募</title>
<style>
  body { margin:0; background:#FAF8F5; color:#333; font:15px/1.6 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  main { max-width:480px; margin:0 auto; padding:24px 16px; }
  .card { background:#fff; border:1px solid #EADFD3; border-radius:12px; padding:18px; }
  h1 { font-size:18px; color:#4B2B06; margin:0 0 12px; }
  .muted { color:#7A6A5C; font-size:13px; }
  a.go { display:block; text-align:center; background:#06C755; color:#fff; border-radius:10px; padding:14px; font-weight:bold; font-size:16px; text-decoration:none; margin:16px 0 8px; }
  .err { color:#C0392B; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>LINE連携</h1>
    <div id="ok" hidden>
      <p>下のボタンを押すと、LINEの認証画面へ移ります。認証後、シフト希望応募の画面に戻ります（10分以内）。</p>
      <a class="go" id="go" href="#">LINEで認証する</a>
    </div>
    <div id="ng" hidden>
      <p class="err">認証を始められませんでした。</p>
      <p>シフト希望応募の画面に戻り、「LINE連携を始める」からやり直してください。</p>
    </div>
    <p class="muted">このページはLINE連携の開始だけに使います。入力や保存はしません。</p>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
